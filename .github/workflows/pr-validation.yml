name: PR Validation

on:
  push:
    branches: [devel]
  pull_request:
    branches: [devel]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Run ruff linter
        run: |
          ruff check awx_tui/ tests/

      - name: Run black format check
        run: |
          black --check awx_tui/ tests/

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Validate package installation
        run: |
          pip install -e .
          python -c "import awx_tui; print(f'AWX TUI version: {awx_tui.__version__}')"

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

  package-test:
    name: Package Installation Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test clean installation
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Test CLI entry point
        run: |
          awx-tui --help || echo "CLI help command completed with exit code $?"

      - name: Test basic imports
        run: |
          python -c "
          import awx_tui
          from awx_tui.client import AWXClient
          from awx_tui.config import InstanceConfig, AppConfig
          from awx_tui.instance_manager import InstanceManager
          from awx_tui.app import AWXTUIApp
          print('✅ All core modules imported successfully')
          "
